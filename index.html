<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Облік рефератів</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg: var(--tg-theme-secondary-bg-color, #f1f2f6);
  --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #ffffff));
  --text: var(--tg-theme-text-color, #14161a);
  --hint: var(--tg-theme-hint-color, #8a8f98);
  --accent: var(--tg-theme-button-color, #2f80ed);
  --accent-text: var(--tg-theme-button-text-color, #ffffff);
  --green:#1f9d63; --red:#e5484d; --orange:#e8930c;
  --line: rgba(128,128,128,.18);
}
@media (prefers-color-scheme: dark){
  :root:not(.tg){ --bg:#0f1115; --card:#1a1d23; --text:#eceef2; --hint:#8b919c; --accent:#4c8df6; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px}
header{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
header h1{font-size:22px;margin:0}
.icon-btn{border:0;background:var(--card);width:38px;height:38px;border-radius:12px;font-size:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border-radius:14px;padding:14px}
.span2{grid-column:span 2}
.kpi .l{color:var(--hint);font-size:13px}
.kpi .v{font-size:22px;font-weight:700;margin-top:2px;letter-spacing:-.3px}
.kpi .s{color:var(--hint);font-size:12px;margin-top:2px}
.v.green{color:var(--green)} .v.red{color:var(--red)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--hint);font-weight:600;margin:20px 4px 8px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:0;background:var(--card);padding:7px 13px;border-radius:999px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-text)}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.prog i{display:block;height:100%;background:var(--green);border-radius:99px}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:16px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bar i{display:block;width:100%;max-width:38px;background:var(--accent);border-radius:6px 6px 3px 3px;min-height:3px}
.bar.cur i{background:var(--green)}
.bar b{font-size:10px;font-weight:600;margin-bottom:3px;white-space:nowrap}
.bar span{font-size:11px;color:var(--hint);margin-top:5px}
.list .it{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.it .grow{flex:1;min-width:0}
.it .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .d{color:var(--hint);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .r{text-align:right;font-weight:600;white-space:nowrap}
.mini{border:0;border-radius:9px;padding:6px 10px;font-size:13px;background:var(--line)}
.mini.pri{background:var(--accent);color:var(--accent-text)}
.mini.ok{background:rgba(31,157,99,.15);color:var(--green)}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;margin:0 4px 4px 0;background:var(--line)}
.b-green{background:rgba(31,157,99,.15);color:var(--green)}
.b-red{background:rgba(229,72,77,.14);color:var(--red)}
.b-orange{background:rgba(232,147,12,.16);color:var(--orange)}
.b-blue{background:rgba(47,128,237,.14);color:var(--accent)}
.order{margin-bottom:10px}
.o-top{display:flex;gap:10px;align-items:flex-start}
.o-e{font-size:22px;line-height:1}
.o-main{flex:1;min-width:0}
.o-title{font-weight:600}
.o-sub{color:var(--hint);font-size:13px;margin-top:2px}
.o-price{font-weight:700;white-space:nowrap}
.o-badges{margin-top:8px}
.o-acts{display:flex;gap:6px;margin-top:6px}
.search{width:100%;border:0;background:var(--card);color:var(--text);border-radius:12px;padding:11px 13px;font:inherit;margin-bottom:10px;outline:none}
.empty{text-align:center;color:var(--hint);padding:36px 16px}
.empty .big{font-size:40px;margin-bottom:6px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
.tabs button{flex:1;border:0;background:none;padding:6px 0;font-size:11px;color:var(--hint);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button .i{font-size:20px;filter:grayscale(1);opacity:.7}
.tabs button.on{color:var(--accent)}
.tabs button.on .i{filter:none;opacity:1}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-text);font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.22);z-index:6}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;z-index:10;align-items:flex-end;justify-content:center}
.ov.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 12px;font-size:19px;display:flex;justify-content:space-between;align-items:center}
.x{border:0;background:var(--line);width:30px;height:30px;border-radius:50%;font-size:15px}
.f{margin-bottom:10px}
.f label{display:block;font-size:13px;color:var(--hint);margin:0 0 4px 2px}
.f input,.f textarea,.f select{width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:11px;padding:10px 12px;font:inherit;outline:none}
.f input:focus,.f textarea:focus{border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--card);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 4px;font-size:14px}
.seg button.on{background:var(--accent);color:var(--accent-text)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;background:var(--accent);color:var(--accent-text);font-weight:600;font-size:16px;margin-top:8px}
.btn.sec{background:var(--card);color:var(--text)}
.btn.danger{background:transparent;color:var(--red)}
.quick{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(20,22,26,.9);color:#fff;padding:9px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.note{color:var(--hint);font-size:13px;margin:6px 2px}
</style>
</head>
<body>
<div class="wrap">
  <header><h1 id="title">Статистика</h1><button class="icon-btn" data-act="settings" aria-label="Налаштування">⚙️</button></header>
  <main id="main"></main>
</div>

<button class="fab" data-act="new" aria-label="Нове замовлення">+</button>

<nav class="tabs">
  <button data-act="tab" data-v="stats" class="on"><span class="i">📈</span>Статистика</button>
  <button data-act="tab" data-v="orders"><span class="i">📋</span>Замовлення</button>
  <button data-act="tab" data-v="clients"><span class="i">👥</span>Клієнти</button>
</nav>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<datalist id="clientList"></datalist>

<script>
/* ---------- Telegram ---------- */
const tg = window.Telegram && window.Telegram.WebApp;
const inTG = !!(tg && tg.initData);
const tgv = v => inTG && tg.isVersionAtLeast && tg.isVersionAtLeast(v);
if (inTG) {
  document.documentElement.classList.add('tg');
  tg.ready(); tg.expand();
  try { tg.setHeaderColor('secondary_bg_color'); tg.setBackgroundColor('secondary_bg_color'); } catch (e) {}
}
const useCloud = inTG && tg.CloudStorage && tgv('6.9');

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => Math.round(+n || 0).toLocaleString('uk-UA') + ' ₴';
const pad = n => String(n).padStart(2, '0');
const isoDate = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => isoDate(new Date());
const curYM = () => today().slice(0, 7);
const shiftYM = k => { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + k); return d.getFullYear() + '-' + pad(d.getMonth() + 1); };
const dayDiff = (a, b) => Math.round((new Date(b + 'T00:00') - new Date(a + 'T00:00')) / 864e5);
const MONTHS = ['січ','лют','бер','кві','тра','чер','лип','сер','вер','жов','лис','гру'];
const fmtDate = s => { if (!s) return ''; const [, m, d] = s.split('-'); return (+d) + ' ' + MONTHS[+m - 1]; };
const TYPES = { ref: { n: 'Реферат', e: '📄' }, pres: { n: 'Презентація', e: '📊' }, other: { n: 'Інше', e: '📝' } };
const ckey = n => String(n || '').trim().toLowerCase();
const debtOf = o => Math.max(0, (+o.price || 0) - (+o.paid || 0));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? b : c); };
function haptic(t) { try { if (!inTG) return; if (t === 'ok') tg.HapticFeedback.notificationOccurred('success'); else tg.HapticFeedback.impactOccurred(t || 'light'); } catch (e) {} }
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2000); }
function askConfirm(msg) { return new Promise(r => { if (tgv('6.2')) tg.showConfirm(msg, ok => r(!!ok)); else r(confirm(msg)); }); }
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e2) {} ta.remove(); return ok;
  }
}

/* ---------- Storage (Telegram CloudStorage, chunked; localStorage fallback) ---------- */
let state = { orders: [], settings: { goal: 0 } };
const CHUNK = 3500; let lastN = 0;
const cGet = keys => new Promise((res, rej) => tg.CloudStorage.getItems(keys, (err, v) => err ? rej(err) : res(v || {})));
const cSet = (k, v) => new Promise((res, rej) => tg.CloudStorage.setItem(k, v, (err, ok) => err ? rej(err) : res(ok)));
const cDel = keys => new Promise(res => tg.CloudStorage.removeItems(keys, () => res()));

function applyLoaded(obj) {
  if (!obj) return;
  if (Array.isArray(obj.orders)) state.orders = obj.orders;
  if (obj.settings) state.settings = Object.assign({ goal: 0 }, obj.settings);
}
async function load() {
  try {
    if (useCloud) {
      const meta = await cGet(['n']);
      const n = parseInt(meta.n || '0', 10);
      lastN = n;
      if (n > 0) {
        const keys = Array.from({ length: n }, (_, i) => 'd' + i);
        const vals = await cGet(keys);
        applyLoaded(JSON.parse(keys.map(k => vals[k] || '').join('')));
        return;
      }
    }
    const s = localStorage.getItem('refstats');
    if (s) applyLoaded(JSON.parse(s));
  } catch (e) { toast('Не вдалося завантажити дані'); }
}
function chunks(s) {
  const out = []; let i = 0;
  while (i < s.length) {
    let end = Math.min(i + CHUNK, s.length);
    const c = s.charCodeAt(end - 1);
    if (end < s.length && c >= 0xD800 && c <= 0xDBFF) end--; // не розрізати емодзі
    out.push(s.slice(i, end)); i = end;
  }
  return out;
}
async function doSave() {
  const s = JSON.stringify({ v: 1, orders: state.orders, settings: state.settings });
  try { localStorage.setItem('refstats', s); } catch (e) {}
  if (!useCloud) return;
  const parts = chunks(s);
  await Promise.all(parts.map((p, i) => cSet('d' + i, p)));
  await cSet('n', String(parts.length));
  if (lastN > parts.length) await cDel(Array.from({ length: lastN - parts.length }, (_, i) => 'd' + (parts.length + i)));
  lastN = parts.length;
}
let saveT, saving = Promise.resolve();
function save() { clearTimeout(saveT); saveT = setTimeout(flush, 150); }
function flush() { clearTimeout(saveT); saving = saving.then(doSave).catch(() => toast('Не вдалося зберегти')); return saving; }
document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });

/* ---------- UI state ---------- */
const ui = { tab: 'stats', period: 'month', of: 'all', q: '' };
const TITLES = { stats: 'Статистика', orders: 'Замовлення', clients: 'Клієнти' };

function render() {
  $('#title').textContent = TITLES[ui.tab];
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === ui.tab));
  $('#main').innerHTML = ui.tab === 'stats' ? renderStats() : ui.tab === 'orders' ? renderOrders() : renderClients();
  const names = [...new Map(state.orders.map(o => [ckey(o.client), o.client])).values()];
  $('#clientList').innerHTML = names.map(n => `<option value="${esc(n)}">`).join('');
  const s = $('#search'); if (s && document.activeElement !== s && ui.focusSearch) { s.focus(); ui.focusSearch = false; }
}

function emptyState(txt) { return `<div class="card empty"><div class="big">🗂️</div>${txt}</div>`; }

/* ---------- Stats ---------- */
function inPeriod(d) { if (ui.period === 'all') return true; return (d || '').slice(0, 7) === (ui.period === 'month' ? curYM() : shiftYM(-1)); }

function clientsAgg() {
  const m = new Map();
  for (const o of state.orders) {
    const k = ckey(o.client); if (!k) continue;
    const c = m.get(k) || { k, name: o.client, contact: '', group: '', n: 0, paid: 0, debt: 0, last: '', oldestDone: '' };
    c.n++; c.paid += +o.paid || 0; c.debt += debtOf(o);
    if ((o.created || '') >= c.last) { c.last = o.created || ''; c.name = o.client; }
    if (o.contact) c.contact = o.contact; if (o.group) c.group = o.group;
    if (o.status === 'done' && debtOf(o) > 0 && o.doneAt && (!c.oldestDone || o.doneAt < c.oldestDone)) c.oldestDone = o.doneAt;
    m.set(k, c);
  }
  return [...m.values()];
}

function renderStats() {
  const O = state.orders;
  const chips = `<div class="chips">${[['month','Цей місяць'],['prev','Минулий місяць'],['all','Весь час']].map(([v,l]) =>
    `<button class="chip ${ui.period===v?'on':''}" data-act="period" data-v="${v}">${l}</button>`).join('')}</div>`;
  if (!O.length) return chips + emptyState('Ще немає замовлень.<br>Натисни <b>+</b>, щоб додати перше.');

  const po = O.filter(o => inPeriod(o.created));
  const earned = O.filter(o => +o.paid > 0 && inPeriod(o.paidAt || o.created)).reduce((s, o) => s + (+o.paid), 0);
  const debtDone = O.filter(o => o.status === 'done').reduce((s, o) => s + debtOf(o), 0);
  const debtWork = O.filter(o => o.status !== 'done').reduce((s, o) => s + debtOf(o), 0);
  const uniq = new Set(po.map(o => ckey(o.client))).size;
  const sumPrice = po.reduce((s, o) => s + (+o.price || 0), 0);
  const avg = po.length ? sumPrice / po.length : 0;
  const agg = clientsAgg();
  const repeat = agg.filter(c => c.n >= 2).length;
  const inWork = O.filter(o => o.status !== 'done').length;
  const periodLbl = ui.period === 'all' ? 'за весь час' : ui.period === 'month' ? 'цього місяця' : 'минулого місяця';

  let h = chips + `<div class="grid">
    <div class="card kpi"><div class="l">Зароблено</div><div class="v green">${money(earned)}</div><div class="s">${periodLbl}</div></div>
    <div class="card kpi"><div class="l">Мають скинути</div><div class="v ${debtDone+debtWork>0?'red':''}">${money(debtDone + debtWork)}</div><div class="s">${money(debtDone)} за зданими</div></div>
    <div class="card kpi"><div class="l">Замовлень</div><div class="v">${po.length}</div><div class="s">${inWork} в роботі зараз</div></div>
    <div class="card kpi"><div class="l">Унікальних клієнтів</div><div class="v">${uniq}</div><div class="s">${repeat} ${plural(repeat,'постійний','постійних','постійних')} за весь час</div></div>
    <div class="card kpi"><div class="l">Середній чек</div><div class="v">${money(avg)}</div><div class="s">сума замовлень ${money(sumPrice)}</div></div>
    <div class="card kpi"><div class="l">Очікується за роботами</div><div class="v">${money(debtWork)}</div><div class="s">ще не здані</div></div>
  </div>`;

  // Goal
  const goal = +state.settings.goal || 0;
  if (goal > 0) {
    const m = curYM();
    const got = O.filter(o => +o.paid > 0 && (o.paidAt || o.created || '').slice(0, 7) === m).reduce((s, o) => s + (+o.paid), 0);
    const d = new Date(); const daysInM = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); const left = daysInM - d.getDate() + 1;
    const pct = Math.min(100, Math.round(got / goal * 100)); const rest = Math.max(0, goal - got);
    h += `<h2>Ціль на місяць</h2><div class="card"><div style="display:flex;justify-content:space-between"><b>${money(got)}</b><span style="color:var(--hint)">з ${money(goal)}</span></div>
      <div class="prog"><i style="width:${pct}%"></i></div>
      <div class="note" style="margin:0">${rest > 0 ? `Залишилось ${money(rest)} · ~${money(rest / left)}/день (${left} ${plural(left,'день','дні','днів')})` : '🎉 Ціль виконано!'}</div></div>`;
  }

  // Chart: last 6 months
  const months = Array.from({ length: 6 }, (_, i) => shiftYM(i - 5));
  const vals = months.map(m => O.filter(o => +o.paid > 0 && (o.paidAt || o.created || '').slice(0, 7) === m).reduce((s, o) => s + (+o.paid), 0));
  const max = Math.max(...vals, 1);
  h += `<h2>Заробіток по місяцях</h2><div class="card"><div class="bars">${months.map((m, i) =>
    `<div class="bar ${i===5?'cur':''}"><b>${vals[i] ? Math.round(vals[i]).toLocaleString('uk-UA') : ''}</b><i style="height:${Math.round(vals[i] / max * 85)}%"></i><span>${MONTHS[+m.slice(5) - 1]}</span></div>`).join('')}</div></div>`;

  // Deadlines
  const dl = O.filter(o => o.status !== 'done' && o.deadline).sort((a, b) => a.deadline.localeCompare(b.deadline)).slice(0, 6);
  if (dl.length) {
    h += `<h2>Найближчі дедлайни</h2><div class="card list">${dl.map(o => {
      const dd = dayDiff(today(), o.deadline);
      const b = dd < 0 ? `<span class="badge b-red">прострочено ${-dd} дн.</span>` : dd === 0 ? `<span class="badge b-red">сьогодні</span>` : dd === 1 ? `<span class="badge b-orange">завтра</span>` : `<span class="badge ${dd<=3?'b-orange':''}">через ${dd} дн.</span>`;
      return `<div class="it" data-act="edit" data-id="${o.id}"><span>${TYPES[o.type]?.e || '📝'}</span><div class="grow"><div class="t">${esc(o.topic || o.subject || TYPES[o.type]?.n)}</div><div class="d">${esc(o.client)} · ${fmtDate(o.deadline)}</div></div>${b}</div>`;
    }).join('')}</div>`;
  }

  // Debtors
  const debtors = agg.filter(c => c.debt > 0).sort((a, b) => b.debt - a.debt);
  if (debtors.length) {
    h += `<h2>Хто винен</h2><div class="card list">${debtors.map(c => {
      const days = c.oldestDone ? dayDiff(c.oldestDone, today()) : null;
      return `<div class="it"><div class="grow" data-act="client" data-k="${esc(c.k)}"><div class="t">${esc(c.name)}</div><div class="d">${days !== null ? `здано ${days} ${plural(days,'день','дні','днів')} тому` : 'робота ще не здана'}</div></div>
        <div class="r" style="color:var(--red)">${money(c.debt)}</div>
        <button class="mini" data-act="remind" data-k="${esc(c.k)}" title="Нагадати">💬</button>
        <button class="mini ok" data-act="payall" data-k="${esc(c.k)}" title="Оплатив усе">✓</button></div>`;
    }).join('')}</div>`;
  }

  // Types
  const tRows = Object.entries(TYPES).map(([k, t]) => {
    const list = po.filter(o => (o.type || 'other') === k);
    return { t, n: list.length, sum: list.reduce((s, o) => s + (+o.price || 0), 0) };
  }).filter(r => r.n);
  if (tRows.length) {
    h += `<h2>По типах робіт · ${periodLbl}</h2><div class="card list">${tRows.map(r =>
      `<div class="it"><span>${r.t.e}</span><div class="grow"><div class="t">${r.t.n}</div><div class="d">${r.n} шт · середня ${money(r.sum / r.n)}</div></div><div class="r">${money(r.sum)}</div></div>`).join('')}</div>`;
  }

  // Top clients
  const top = agg.filter(c => c.paid > 0).sort((a, b) => b.paid - a.paid).slice(0, 5);
  if (top.length) {
    h += `<h2>Топ клієнтів</h2><div class="card list">${top.map((c, i) =>
      `<div class="it" data-act="client" data-k="${esc(c.k)}"><span>${['🥇','🥈','🥉','4️⃣','5️⃣'][i]}</span><div class="grow"><div class="t">${esc(c.name)}</div><div class="d">${c.n} ${plural(c.n,'замовлення','замовлення','замовлень')}${c.group ? ' · ' + esc(c.group) : ''}</div></div><div class="r">${money(c.paid)}</div></div>`).join('')}</div>`;
  }
  return h;
}

/* ---------- Orders ---------- */
function payBadge(o) {
  const p = +o.paid || 0, pr = +o.price || 0;
  if (pr > 0 && p >= pr) return '<span class="badge b-green">оплачено</span>';
  if (p > 0) return `<span class="badge b-orange">скинули ${money(p)} з ${money(pr)}</span>`;
  return '<span class="badge b-red">не оплачено</span>';
}
function renderOrders() {
  const filters = [['all','Всі'],['work','В роботі'],['unpaid','Не оплачено'],['paid','Оплачено']];
  let h = `<input class="search" id="search" type="search" placeholder="Пошук: клієнт, тема, предмет, група" value="${esc(ui.q)}">
    <div class="chips">${filters.map(([v,l]) => `<button class="chip ${ui.of===v?'on':''}" data-act="of" data-v="${v}">${l}</button>`).join('')}</div>`;
  const q = ui.q.trim().toLowerCase();
  let list = state.orders.filter(o => {
    if (ui.of === 'work' && o.status === 'done') return false;
    if (ui.of === 'unpaid' && debtOf(o) === 0) return false;
    if (ui.of === 'paid' && debtOf(o) > 0) return false;
    if (q && ![o.client, o.topic, o.subject, o.group, o.contact, o.note].some(x => String(x || '').toLowerCase().includes(q))) return false;
    return true;
  });
  list.sort(ui.of === 'work'
    ? (a, b) => (a.deadline || '9999').localeCompare(b.deadline || '9999')
    : (a, b) => (b.created || '').localeCompare(a.created || '') || (b.id > a.id ? 1 : -1));
  if (!state.orders.length) return h + emptyState('Ще немає замовлень.<br>Натисни <b>+</b>, щоб додати перше.');
  if (!list.length) return h + emptyState('Нічого не знайдено');
  const total = list.reduce((s, o) => s + (+o.price || 0), 0), dsum = list.reduce((s, o) => s + debtOf(o), 0);
  h += `<div class="note">${list.length} ${plural(list.length,'замовлення','замовлення','замовлень')} · ${money(total)}${dsum ? ` · винні ${money(dsum)}` : ''}</div>`;
  h += list.map(o => {
    const t = TYPES[o.type] || TYPES.other;
    let dlB = '';
    if (o.status !== 'done' && o.deadline) { const dd = dayDiff(today(), o.deadline); dlB = `<span class="badge ${dd < 0 ? 'b-red' : dd <= 2 ? 'b-orange' : ''}">⏰ ${fmtDate(o.deadline)}</span>`; }
    const acts = [`<button class="mini" data-act="edit" data-id="${o.id}">✏️ Редагувати</button>`];
    if (o.status !== 'done') acts.push(`<button class="mini pri" data-act="done" data-id="${o.id}">Здано</button>`);
    if (debtOf(o) > 0) acts.push(`<button class="mini ok" data-act="paid" data-id="${o.id}">Оплачено</button>`);
    return `<div class="card order" data-act="edit" data-id="${o.id}">
      <div class="o-top"><span class="o-e">${t.e}</span><div class="o-main"><div class="o-title">${esc(o.topic || o.subject || t.n)}</div>
      <div class="o-sub">${esc(o.client)}${o.group ? ' · ' + esc(o.group) : ''}${o.subject && o.topic ? ' · ' + esc(o.subject) : ''} · ${fmtDate(o.created)}</div></div>
      <div class="o-price">${money(o.price)}</div></div>
      <div class="o-badges"><span class="badge ${o.status === 'done' ? 'b-blue' : ''}">${o.status === 'done' ? 'здано' : 'в роботі'}</span>${payBadge(o)}${dlB}</div>
      <div class="o-acts">${acts.join('')}</div></div>`;
  }).join('');
  return h;
}

/* ---------- Clients ---------- */
function renderClients() {
  const agg = clientsAgg().sort((a, b) => b.debt - a.debt || b.paid - a.paid);
  if (!agg.length) return emptyState('Клієнти з’являться тут після першого замовлення');
  const repeat = agg.filter(c => c.n >= 2).length;
  return `<div class="note">${agg.length} ${plural(agg.length,'клієнт','клієнти','клієнтів')} · ${repeat} замовляли більше одного разу (${Math.round(repeat / agg.length * 100)}%)</div>
    <div class="note">Натисни на клієнта, щоб змінити ім’я, @username чи групу</div>
    <div class="card list">${agg.map(c => `<div class="it" data-act="editclient" data-k="${esc(c.k)}">
      <div class="grow"><div class="t">${esc(c.name)}${c.n >= 2 ? ' ⭐' : ''}</div><div class="d">${c.n} ${plural(c.n,'замовлення','замовлення','замовлень')}${c.group ? ' · ' + esc(c.group) : ''}${c.contact ? ' · ' + esc(c.contact) : ''} · ост. ${fmtDate(c.last)}</div></div>
      <div class="r">${money(c.paid)}${c.debt ? `<div style="color:var(--red);font-size:13px">винен ${money(c.debt)}</div>` : ''}</div></div>`).join('')}</div>`;
}

function openClient(k) {
  const c = clientsAgg().find(x => x.k === k); if (!c) return;
  openSheet(`<form id="cf" data-k="${esc(k)}" onsubmit="return false">
    <h3>Клієнт<button type="button" class="x" data-act="close">✕</button></h3>
    <div class="f"><label>Ім’я</label><input id="c_name" value="${esc(c.name)}"></div>
    <div class="row2">
      <div class="f"><label>Telegram</label><input id="c_contact" value="${esc(c.contact)}" placeholder="@username"></div>
      <div class="f"><label>Група</label><input id="c_group" value="${esc(c.group)}"></div>
    </div>
    <p class="note">Зміни застосуються до всіх ${c.n} ${plural(c.n,'замовлення','замовлень','замовлень')} цього клієнта. Оплачено ${money(c.paid)}${c.debt ? `, винен ${money(c.debt)}` : ''}.</p>
    <button type="button" class="btn" data-act="saveclient">Зберегти</button>
    <button type="button" class="btn sec" data-act="client" data-k="${esc(k)}">📋 Замовлення клієнта</button>
    <button type="button" class="btn sec" data-act="newfor" data-k="${esc(k)}">＋ Нове замовлення для нього</button>
  </form>`);
}
function saveClient() {
  const k = $('#cf').dataset.k, name = $('#c_name').value.trim();
  if (!name) { toast('Ім’я не може бути порожнім'); return; }
  const contact = $('#c_contact').value.trim(), group = $('#c_group').value.trim();
  const nk = ckey(name);
  if (nk !== k && state.orders.some(o => ckey(o.client) === nk)) toast('Об’єднано з клієнтом «' + name + '»');
  state.orders.forEach(o => { if (ckey(o.client) === k) { o.client = name; o.contact = contact; o.group = group; } });
  save(); closeSheet(); render(); haptic('ok');
}

/* ---------- Sheets ---------- */
function openSheet(html) { $('#sheet').innerHTML = html; $('#ov').classList.add('open'); if (inTG) tg.BackButton.show(); }
function closeSheet() { $('#ov').classList.remove('open'); if (inTG) tg.BackButton.hide(); }
if (inTG) tg.BackButton.onClick(closeSheet);
$('#ov').addEventListener('click', e => { if (e.target.id === 'ov') closeSheet(); });

function seg(group, cur, opts) {
  return `<div class="seg">${opts.map(([v, l]) => `<button type="button" class="${cur === v ? 'on' : ''}" data-act="seg" data-g="${group}" data-v="${v}">${l}</button>`).join('')}</div>`;
}
function openOrder(id) {
  const o = id ? state.orders.find(x => x.id === id) : null;
  const v = o || { type: 'ref', status: 'work', created: today(), price: '', paid: '' };
  openSheet(`<form id="f" data-id="${o ? o.id : ''}" data-type="${v.type || 'ref'}" data-status="${v.status || 'work'}" onsubmit="return false">
    <h3>${o ? 'Замовлення' : 'Нове замовлення'}<button type="button" class="x" data-act="close">✕</button></h3>
    <div class="f">${seg('type', v.type || 'ref', [['ref','📄 Реферат'],['pres','📊 Презентація'],['other','📝 Інше']])}</div>
    <div class="f"><label>Клієнт *</label><input id="f_client" list="clientList" autocomplete="off" value="${esc(v.client)}" placeholder="Ім’я Прізвище"></div>
    <div class="row2">
      <div class="f"><label>Telegram</label><input id="f_contact" value="${esc(v.contact)}" placeholder="@username"></div>
      <div class="f"><label>Група</label><input id="f_group" value="${esc(v.group)}" placeholder="напр. 21-Б"></div>
    </div>
    <div class="f"><label>Предмет</label><input id="f_subject" value="${esc(v.subject)}" placeholder="Українська культура"></div>
    <div class="f"><label>Тема</label><input id="f_topic" value="${esc(v.topic)}"></div>
    <div class="row2">
      <div class="f"><label>Ціна, ₴</label><input id="f_price" type="number" inputmode="numeric" min="0" value="${esc(v.price)}"></div>
      <div class="f"><label>Вже скинули, ₴</label><input id="f_paid" type="number" inputmode="numeric" min="0" value="${esc(v.paid)}"></div>
    </div>
    <div class="quick"><button type="button" class="mini" data-act="fullpay">Оплатив повністю</button><button type="button" class="mini" data-act="halfpay">Передоплата 50%</button></div>
    <div class="f" style="margin-top:10px">${seg('status', v.status || 'work', [['work','⏳ В роботі'],['done','✅ Здано']])}</div>
    <div class="row2">
      <div class="f"><label>Дата замовлення</label><input id="f_created" type="date" value="${esc(v.created)}"></div>
      <div class="f"><label>Дедлайн</label><input id="f_deadline" type="date" value="${esc(v.deadline)}"></div>
    </div>
    <div class="f"><label>Дата оплати</label><input id="f_paidAt" type="date" value="${esc(v.paidAt)}"></div>
    <div class="f"><label>Нотатка</label><textarea id="f_note" rows="2" placeholder="обсяг, вимоги викладача…">${esc(v.note)}</textarea></div>
    <button type="button" class="btn" data-act="save">Зберегти</button>
    ${o ? `<button type="button" class="btn sec" data-act="dup" data-id="${o.id}">Повторне замовлення цього клієнта</button><button type="button" class="btn danger" data-act="del" data-id="${o.id}">Видалити</button>` : ''}
  </form>`);
  const fc = $('#f_client');
  fc.addEventListener('change', () => {
    const k = ckey(fc.value); const prev = [...state.orders].reverse().find(x => ckey(x.client) === k);
    if (prev) { if (!$('#f_contact').value) $('#f_contact').value = prev.contact || ''; if (!$('#f_group').value) $('#f_group').value = prev.group || ''; }
  });
  $('#f_paid').addEventListener('input', () => { if (+$('#f_paid').value > 0 && !$('#f_paidAt').value) $('#f_paidAt').value = today(); });
  if (!o) setTimeout(() => fc.focus(), 250);
}

function saveOrder() {
  const f = $('#f'); const id = f.dataset.id;
  const old = id ? state.orders.find(x => x.id === id) : null;
  const client = $('#f_client').value.trim();
  if (!client) { toast('Вкажи клієнта'); $('#f_client').focus(); return; }
  const price = Math.max(0, +$('#f_price').value || 0), paid = Math.max(0, +$('#f_paid').value || 0);
  const status = f.dataset.status, prevStatus = old ? old.status : null;
  const o = old || { id: uid() };
  Object.assign(o, {
    client, contact: $('#f_contact').value.trim(), group: $('#f_group').value.trim(),
    type: f.dataset.type, subject: $('#f_subject').value.trim(), topic: $('#f_topic').value.trim(),
    price, paid, status, created: $('#f_created').value || today(), deadline: $('#f_deadline').value, note: $('#f_note').value.trim()
  });
  if (paid > 0) o.paidAt = $('#f_paidAt').value || today(); else delete o.paidAt;
  if (status === 'done' && prevStatus !== 'done') o.doneAt = o.doneAt || today();
  if (status !== 'done') delete o.doneAt;
  if (!old) state.orders.push(o);
  save(); closeSheet(); render(); haptic('ok'); toast(old ? 'Збережено' : 'Додано');
}

function openSettings() {
  openSheet(`<h3>Налаштування<button class="x" data-act="close">✕</button></h3>
    <div class="f"><label>Ціль заробітку на місяць, ₴ (0 — вимкнено)</label><input id="s_goal" type="number" inputmode="numeric" min="0" value="${+state.settings.goal || ''}"></div>
    <button class="btn" data-act="savegoal">Зберегти ціль</button>
    <h2>Резервна копія</h2>
    <button class="btn sec" data-act="export">📤 Скопіювати всі дані</button>
    <div class="f" style="margin-top:12px"><label>Вставити скопійовані дані для відновлення</label><textarea id="s_import" rows="3" placeholder='{"orders":[...]}'></textarea></div>
    <button class="btn sec" data-act="import">📥 Відновити з копії</button>
    <p class="note">Дані зберігаються ${useCloud ? 'в хмарі Telegram, прив’язано до твого акаунта й цього бота — синхронізуються між телефоном і ПК' : 'лише в цьому браузері (відкрий через бота в Telegram, щоб була синхронізація)'}. Замовлень: ${state.orders.length}.</p>
    <button class="btn danger" data-act="wipe">Видалити всі дані</button>`);
}

/* ---------- Events ---------- */
document.addEventListener('input', e => { if (e.target.id === 'search') { ui.q = e.target.value; ui.focusSearch = true; const pos = e.target.selectionStart; render(); const s = $('#search'); if (s) { s.focus(); try { s.setSelectionRange(pos, pos); } catch (er) {} } } });

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id, k = el.dataset.k;
  const find = () => state.orders.find(o => o.id === id);
  switch (a) {
    case 'tab': ui.tab = el.dataset.v; haptic(); render(); window.scrollTo(0, 0); break;
    case 'period': ui.period = el.dataset.v; haptic(); render(); break;
    case 'of': ui.of = el.dataset.v; haptic(); render(); break;
    case 'new': haptic(); openOrder(null); break;
    case 'edit': openOrder(id); break;
    case 'close': closeSheet(); break;
    case 'settings': openSettings(); break;
    case 'seg': {
      const f = $('#f'); f.dataset[el.dataset.g] = el.dataset.v;
      el.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el)); haptic(); break;
    }
    case 'fullpay': $('#f_paid').value = $('#f_price').value || 0; if (!$('#f_paidAt').value) $('#f_paidAt').value = today(); haptic(); break;
    case 'halfpay': $('#f_paid').value = Math.round((+$('#f_price').value || 0) / 2); if (!$('#f_paidAt').value) $('#f_paidAt').value = today(); haptic(); break;
    case 'save': saveOrder(); break;
    case 'dup': {
      const o = find(); closeSheet(); openOrder(null);
      $('#f_client').value = o.client; $('#f_contact').value = o.contact || ''; $('#f_group').value = o.group || ''; $('#f_price').value = o.price || '';
      break;
    }
    case 'del':
      if (await askConfirm('Видалити це замовлення?')) { state.orders = state.orders.filter(o => o.id !== id); save(); closeSheet(); render(); toast('Видалено'); }
      break;
    case 'done': { const o = find(); o.status = 'done'; o.doneAt = today(); save(); render(); haptic('ok'); toast('Позначено як здано'); break; }
    case 'paid': { const o = find(); o.paid = +o.price || 0; o.paidAt = today(); save(); render(); haptic('ok'); toast('💰 ' + money(o.price) + ' отримано'); break; }
    case 'payall': {
      const list = state.orders.filter(o => ckey(o.client) === k && debtOf(o) > 0);
      const sum = list.reduce((s, o) => s + debtOf(o), 0);
      if (await askConfirm(`${list[0].client} скинув ${money(sum)}?`)) { list.forEach(o => { o.paid = +o.price || 0; o.paidAt = today(); }); save(); render(); haptic('ok'); }
      break;
    }
    case 'remind': {
      const list = state.orders.filter(o => ckey(o.client) === k && debtOf(o) > 0);
      const sum = list.reduce((s, o) => s + debtOf(o), 0);
      const what = list.length === 1 ? (TYPES[list[0].type]?.n || 'роботу').toLowerCase() : 'роботи';
      const first = (list[0].client || '').split(' ')[0];
      const text = `Привіт, ${first}! Нагадую про оплату за ${what} — ${money(sum)} 🙂`;
      const copied = await copyText(text);
      const c = (list.find(o => o.contact) || {}).contact;
      if (c) {
        const u = c.replace(/^@/, '').replace(/^https?:\/\/t\.me\//, '');
        toast(copied ? 'Текст нагадування скопійовано' : text);
        const url = 'https://t.me/' + u;
        setTimeout(() => { if (inTG) tg.openTelegramLink(url); else window.open(url, '_blank'); }, 400);
      } else toast(copied ? 'Скопійовано. Додай @username клієнту, щоб відкривався чат' : text);
      break;
    }
    case 'editclient': openClient(k); break;
    case 'saveclient': saveClient(); break;
    case 'newfor': {
      const c = clientsAgg().find(x => x.k === k); closeSheet(); openOrder(null);
      $('#f_client').value = c.name; $('#f_contact').value = c.contact || ''; $('#f_group').value = c.group || '';
      break;
    }
    case 'client': closeSheet(); ui.tab = 'orders'; ui.of = 'all'; ui.q = state.orders.find(o => ckey(o.client) === k)?.client || k; haptic(); render(); window.scrollTo(0, 0); break;
    case 'savegoal': state.settings.goal = Math.max(0, +$('#s_goal').value || 0); save(); closeSheet(); render(); haptic('ok'); break;
    case 'export': toast(await copyText(JSON.stringify({ v: 1, orders: state.orders, settings: state.settings })) ? 'Скопійовано — збережи в «Обране»' : 'Не вдалося скопіювати'); break;
    case 'import': {
      try {
        const obj = JSON.parse($('#s_import').value.trim());
        const orders = Array.isArray(obj) ? obj : obj.orders;
        if (!Array.isArray(orders)) throw 0;
        if (await askConfirm(`Замінити поточні дані (${state.orders.length}) на копію (${orders.length} замовлень)?`)) {
          state.orders = orders; if (obj.settings) state.settings = Object.assign({ goal: 0 }, obj.settings);
          save(); closeSheet(); render(); toast('Відновлено');
        }
      } catch (er) { toast('Це не схоже на копію даних'); }
      break;
    }
    case 'wipe':
      if (await askConfirm('Точно видалити ВСІ замовлення? Це не можна скасувати.')) { state.orders = []; save(); closeSheet(); render(); }
      break;
  }
});

load().then(render);
</script>
</body>
</html>
